# baseURL: https://development.ecosounds.org/
locale: en-US
title: Ecoacoustic Tour of Australia
theme: "microsite-template"
menus:
  main:
    - name: Image Credits
      pageRef: /image-credits/
      weight: 10
server:
  headers:
    - for: /**
      values:
        Access-Control-Allow-Origin: "*"
        Cross-Origin-Opener-Policy: same-origin
        Cross-Origin-Embedder-Policy: require-corp
        Cross-Origin-Resource-Policy: cross-origin
        Content-Security-Policy-Report-Only: "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline' https://cdn.jsdelivr.net https://maps.googleapis.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com https://maps.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.googleapis.com https://*.gstatic.com https://*.googleusercontent.com; connect-src 'self' data: https://*.ecosounds.org https://*.acousticobservatory.org https://cdn.jsdelivr.net https://maps.googleapis.com https://maps.gstatic.com https://www.google-analytics.com; media-src 'self' https://*.ecosounds.org https://*.acousticobservatory.org; frame-src 'none'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';"
        ignoreLogs:
          - warning-goldmark-raw-html
module:
  hugoVersion:
    extended: false
    min: 0.116.0
markup:
  goldmark:
    renderer:
      unsafe: true
security:
  funcs:
    getenv:
      - "^HUGO_"
      - "^CI$"
      - "^GOOGLE_MAPS_API_KEY$"
      - "^GOOGLE_MAPS_MAP_ID$"
params:
  api_host: https://api.acousticobservatory.org
  workbench_host: https://data.acousticobservatory.org
  hero_image: images/riflebird_banner.jpg
  sponsors:
    logos:
      - image: "images/footer/Google_2026_logo.svg"
        alt: "Google"
        url: "https://about.google/"
      - image: "images/footer/JCU.webp"
        alt: "James Cook University"
        url: "https://www.jcu.edu.au/"
      - image: "images/footer/QUT_RGB.png"
        alt: "Queensland University of Technology"
        url: "https://www.qut.edu.au/"
      - image: "images/footer/BirdLife_Australia_logo.jpg"
        alt: "BirdLife Australia"
        url: "https://birdlife.org.au/"
  tasks:
    verification: false
  progress_mock:
    user_tasks: 3
    total_tasks: 10
    total_verifications: 12480
    leaderboard:
      - name: "Alice Smith"
        is_current: false
      - name: "Bob Jones"
        is_current: false
      - name: "Charlie Brown"
        is_current: false
      - name: "You"
        is_current: true
  campaigns:
    - name: "Daintree Rainforest Observatory"
      tags:
        - "Buff-breasted Paradise-Kingfisher"
        - "Wompoo Fruit Dove"
        - "Spotted Catbird"
        - "Victoria's Riflebird"
        - "Southern Cassowary"
        - "Bar-shouldered Dove"
        - "Sulphur-crested Cockatoo"
        - "Fan-tailed Cuckoo"
      filters:
        filter:
          sites.id:
            in:
              - 197
              - 198
              - 199
              - 200
    - name: "Bowra Station"
      tags:
        - "Pink Cockatoo"
        - "Budgerigar"
        - "Crested Bellbird"
        - "Spotted Nightjar"
        - "Cockatiel"
        - "Brown Treecreeper"
        - "Crucifix Frog"
        - "Red Tree Frog"
      filters:
        filter:
          sites.id:
            in:
              - 257
              - 258
              - 259
              - 260
    - name: "Mount Barney"
      tags:
        - "Glossy-black Cockatoo"
        - "Koala"
        - "Spotted Quail-thrush"
        - "Scarlet Myzomela"
        - "White-throated Nightjar"
        - "Sugar Glider"
        - "Southern Boobook"
        - "Grey Shrike-thrush"
      filters:
        filter:
          sites.id:
            in:
              - 1
              - 2
              - 3
              - 4
    - name: "Monjebup Reserve"
      tags:
        - "Western Whipbird"
        - "Malleefowl"
        - "Weebill"
        - "Stubble Quail"
        - "Carnaby's Black-Cockatoo"
      filters:
        filter:
          sites.id:
            in:
              - 361
              - 362
              - 363
              - 364
    - name: "Marshmead"
      tags:
        - "Yellow-bellied Glider"
        - "Bell Miner"
        - "Superb Lyrebird"
        - "Wonga Pigeon"
        - "Yellow-tailed Black-Cockatoo"
      filters:
        filter:
          sites.id:
            in:
              - 309
              - 310
              - 311
              - 312
    - name: "Binya"
      tags:
        - "Painted Honeyeater"
        - "Horsfield's Bronze-cuckoo"
        - "Red-capped Robin"
        - "Striped Honeyeater"
        - "Tawny Frogmouth"
      filters:
        filter:
          sites.id:
            in:
              - 333
              - 334
              - 335
              - 336
  map:
    min_zoom: 1
    max_zoom: 21
    fit_initial_bounds: false
    initial_center:
      latitude: -27.5
      longitude: 150
    initial_zoom: 4
    strict_bounds: false
    bounds:
      north: -5
      south: -50
      east: -140
      west: 65
    sites:
      - campaign: "Daintree Rainforest Observatory"
        latitude: -16.103236
        longitude: 145.452491
        page: "/daintree/"
        description: "The oldest rainforest in the world, listed as a UNESCO Heritage Site."
        content:
          image: "images/sites/daintree/daintree.jpg"
          species:
            - name: "Buff-breasted Paradise-Kingfisher"
              description: "A bright, long-tailed kingfisher that breeds in North Queensland rainforests and migrates to New Guinea for the winter."

              image: "images/species/Buff-breasted-Paradise-Kingfisher.jpg"
              examples:
                - url: "https://api.acousticobservatory.org/audio_recordings/491051/media.mp3"
            - name: "Wompoo Fruit Dove"
              description: "A large fruit dove that feeds quietly in the canopy. Known for its 'Wompoo!' call."
              image: "images/species/Wompoo-Fruit-Dove.jpg"
              examples:
                - url: "https://api.acousticobservatory.org/audio_recordings/492563/media.mp3?end_offset=5880&start_offset=5850"
            - name: "Spotted Catbird"
              description: "A large rainforest species with highly unusual cat-like calls."
              image: "images/species/Spotted-Catbird.jpg"
              examples:
                - url: "https://api.acousticobservatory.org/audio_recordings/490212/media.mp3?end_offset=570&start_offset=540"
            - name: "Victoria's Riflebird"
              description: "Iconic rainforest bird-of-paradise. Voice is not as showy as its plumage."
              image: "images/species/Victorias-Riflebird.jpg"
              examples:
                - url: "https://api.acousticobservatory.org/audio_recordings/492310/media.mp3?end_offset=2670&start_offset=2640"
            - name: "Southern Cassowary"
              description: "A tall, flightless rainforest bird that disperses fallen fruit and produces low, resonant mating calls."
              examples:
                - url: "https://api.acousticobservatory.org/audio_recordings/487381/media.mp3"
            - name: "Bar-shouldered Dove"
              description: "A long-tailed dove that feeds on the ground near water and gives a rhythmic, cooing call."
            - name: "Sulphur-crested Cockatoo"
              description: "A large white cockatoo with a yellow crest that travels in noisy flocks and gives loud, harsh screeches."
            - name: "Fan-tailed Cuckoo"
              description: "A grey-and-rufous cuckoo that lays its eggs in other birds' nests and gives a mournful, descending trill."
      - campaign: "Mount Barney"
        latitude: -28.234639
        longitude: 152.641407
        page: "/mount-barney/"
        description: "South-east Queensland's most well-known mountain."
        content:
          image: "images/sites/mtbarney/mtbarney.jpg"
          species:
            - name: "Glossy-black Cockatoo"
              description: "A dark, quiet cockatoo that specializes in she-oak seeds, with males showing red tail panels and females yellow markings."
              image: "images/species/Glossy-black-Cockatoo.jpg"
              examples:
                - url: "https://api.acousticobservatory.org/audio_recordings/1421163/media.mp3?end_offset=4650&start_offset=4620"
            - name: "Koala"
              description: "A mostly nocturnal, tree-dwelling marsupial that rests for long periods, feeds on eucalypt leaves, and communicates with deep bellows."
              image: "images/species/Koala.jpg"
              examples:
                - url: "https://api.acousticobservatory.org/audio_recordings/508757/media.mp3?end_offset=60&start_offset=30"
            - name: "Spotted Quail-thrush"
              description: "A cryptic, ground-dwelling bird of dry forest that forages through leaf litter and is more often heard than seen."
              image: "images/species/Spotted-Quail-thrush.jpg"
              examples:
                - url: "https://api.acousticobservatory.org/audio_recordings/1417075/media.mp3?end_offset=4440&start_offset=4410"
            - name: "Scarlet Myzomela"
              description: "A tiny honeyeater whose bright-red males visit flowering trees for nectar and insects and sing a tuneful, tinkling song."
              image: "images/species/Scarlet-Myzomela.jpg"
              examples:
                - url: "https://api.acousticobservatory.org/audio_recordings/1420677/media.mp3?end_offset=4140&start_offset=4110"
            - name: "White-throated Nightjar"
              description: "A nocturnal aerial hunter with mottled camouflage and a white throat patch, known for a bubbling song at dusk and dawn."
              image: "images/species/White-throated-Nightjar.jpg"
              examples:
                - url: "https://api.acousticobservatory.org/audio_recordings/511298/media.mp3?end_offset=5100&start_offset=5070"
            - name: "Sugar Glider"
              description: "A small nocturnal glider that sails between trees on furry membranes, feeds on sap and nectar, and gives yapping calls."
              examples:
                - url: "https://api.acousticobservatory.org/audio_recordings/1873028/media.mp3?end_offset=4680&start_offset=4650"
            - name: "Southern Boobook"
              description: "Australia's smallest and most widespread owl, best known for its familiar two-note 'boo-book' call at night."
            - name: "Grey Shrike-thrush"
              description: "A plain grey songbird of forest and woodland with one of the richest, most melodious songs in the bush."
      - campaign: "Bowra Station"
        latitude: -27.981830
        longitude: 145.611615
        page: "/bowra/"
        description: "An inland Queensland soundscape near Cunnamulla, a haven for birdwatchers."
        content:
          image: "images/sites/bowra/bowra.jpg"
          species:
            - name: "Pink Cockatoo"
              description: "A striking white-and-pink cockatoo with a raised red-and-yellow crest that usually travels in pairs or small groups."
              image: "images/species/Pink-Cockatoo.jpg"
              examples:
                - url: "https://api.acousticobservatory.org/audio_recordings/1540597/media.mp3?end_offset=150&start_offset=120"
            - name: "Budgerigar"
              description: "A small green-and-yellow parrot that travels in nomadic flocks, feeds on grass seeds, and gives frequent chattering contact calls."
              image: "images/species/Budgerigar.jpg"
              examples:
                - url: "https://api.acousticobservatory.org/audio_recordings/457814/media.mp3?end_offset=450&start_offset=420"
            - name: "Crested Bellbird"
              description: "A grey woodland bird with a black crest and breast whose bell-like call carries across open scrub."
              image: "images/species/Crested-Bellbird.jpg"
              examples:
                - url: "https://api.acousticobservatory.org/audio_recordings/1406387/media.mp3?end_offset=45300&start_offset=45270"
            - name: "Spotted Nightjar"
              description: "A heavily mottled, ground-roosting nightjar that hunts flying insects after dark and calls with an ascending series of notes."
              image: "images/species/Spotted-Nightjar.jpg"
              examples:
                - url: "https://api.acousticobservatory.org/audio_recordings/7315/media.mp3?end_offset=6130&start_offset=6100"
            - name: "Cockatiel"
              description: "A nomadic cockatoo with an expressive crest and long tail that moves between water and seed-rich country in pairs or flocks."
              image: "images/species/Cockatiel.jpg"
              examples:
                - url: "https://api.acousticobservatory.org/audio_recordings/7213/media.mp3?end_offset=4170&start_offset=4140"
            - name: "Brown Treecreeper"
              description: "A social treecreeper that spirals up rough trunks and probes bark and leaf litter for insects in small groups."
              image: "images/species/Brown-Treecreeper.jpg"
              examples:
                - url: "https://api.acousticobservatory.org/audio_recordings/7213/media.mp3?end_offset=4200&start_offset=4170"
            - name: "Crucifix Frog"
              description: "A bright yellow, burrowing frog of inland plains that emerges after heavy rain and calls with a low 'whoop'."
            - name: "Red Tree Frog"
              description: "A small reddish-brown tree frog that gathers at temporary pools after rain and gives a long, nasal, buzzing call."
              examples:
                - url: "https://api.acousticobservatory.org/audio_recordings/1681043/media.mp3?end_offset=1170&start_offset=1140"
      - campaign: "Monjebup Reserve"
        latitude: -34.243607
        longitude: 118.560849
        page: "/monjebup/"
        description: "Mallee and heathland in south-western Australia that shelters several threatened species."
        content:
          species:
            - name: "Western Whipbird"
              description: "A shy, olive-grey bird of dense mallee and heath that is far more often heard than seen, with pairs singing a duet of scratchy whistles."
              examples:
                - url: "https://api.acousticobservatory.org/audio_recordings/156490/media.mp3?end_offset=60&start_offset=30"
            - name: "Malleefowl"
              description: "A large, ground-dwelling bird of mallee country; males tend huge incubation mounds and give deep, booming calls."
            - name: "Weebill"
              description: "Australia's smallest bird, a pale, short-billed canopy forager that moves through eucalypts in busy groups with a loud, cheerful song."
              examples:
                - url: "https://api.acousticobservatory.org/audio_recordings/344871/media.mp3?end_offset=4830&start_offset=4800"
            - name: "Stubble Quail"
              description: "A cryptic, ground-dwelling quail of grassland and crops, usually detected by its far-carrying, repeated whistled call."
              examples:
                - url: "https://api.acousticobservatory.org/audio_recordings/344510/media.mp3?end_offset=7140&start_offset=7110"
            - name: "Baudin's/Carnaby's Black Cockatoo"
              description: "Two closely related white-tailed black cockatoos found only in south-western Australia, which travel in noisy flocks and give wailing contact calls."
              examples:
                - url: "https://api.acousticobservatory.org/audio_recordings/351141/media.mp3?end_offset=4350&start_offset=4320"
            - name: "Placeholder species"
              description: "Placeholder description."
            - name: "Placeholder species"
              description: "Placeholder description."
            - name: "Placeholder species"
              description: "Placeholder description."
      - campaign: "Marshmead"
        latitude: -37.486020
        longitude: 149.831509
        page: "/marshmead/"
        description: "Tall coastal forest in far East Gippsland, rich with nocturnal and forest-dwelling species."
        content:
          species:
            - name: "Yellow-bellied Glider"
              description: "A nocturnal glider of tall eucalypt forest that feeds on sap and nectar and is known for its loud, gurgling shrieks."
              examples:
                - url: "https://api.acousticobservatory.org/audio_recordings/1209740/media.mp3?end_offset=7170&start_offset=7140"
            - name: "Bell Miner"
              description: "A colonial green honeyeater whose constant, tinkling bell-like calls ring through the forest understorey."
              examples:
                - url: "https://api.acousticobservatory.org/audio_recordings/1208936/media.mp3?end_offset=6990&start_offset=6960"
            - name: "Superb Lyrebird"
              description: "A large ground-dwelling songbird famous for its elaborate song, which mimics many other forest species."
              examples:
                - url: "https://api.acousticobservatory.org/audio_recordings/1209384/media.mp3?end_offset=4980&start_offset=4950"
            - name: "Wonga Pigeon"
              description: "A plump grey-and-white pigeon of the forest floor that repeats a loud, monotonous call for long periods."
              examples:
                - url: "https://api.acousticobservatory.org/audio_recordings/1209912/media.mp3?end_offset=3720&start_offset=3690"
            - name: "Yellow-tailed Black-Cockatoo"
              description: "A large black cockatoo with yellow cheek and tail panels that feeds on seeds and wood-boring grubs and gives a far-carrying, wailing call."
              examples:
                - url: "https://api.acousticobservatory.org/audio_recordings/1214877/media.mp3?end_offset=5490&start_offset=5460"
            - name: "Placeholder species"
              description: "Placeholder description."
            - name: "Placeholder species"
              description: "Placeholder description."
            - name: "Placeholder species"
              description: "Placeholder description."
      - campaign: "Binya"
        latitude: -34.219819
        longitude: 146.267081
        page: "/binya/"
        description: "Dry inland woodland in the Riverina of New South Wales."
        content:
          species:
            - name: "Painted Honeyeater"
              description: "A nomadic black-and-white honeyeater with yellow wing edges that specialises in mistletoe fruit."
              examples:
                - url: "https://api.acousticobservatory.org/audio_recordings/1452067/media.mp3?end_offset=750&start_offset=720"
            - name: "Horsfield's Bronze Cuckoo"
              description: "A small bronze-green cuckoo that lays its eggs in other birds' nests and gives a descending, whistled call."
              examples:
                - url: "https://api.acousticobservatory.org/audio_recordings/1240530/media.mp3?end_offset=4380&start_offset=4350"
            - name: "Red-capped Robin"
              description: "A small dry-woodland robin; males have a bright red cap and breast and sing a rapid, insect-like trill."
              examples:
                - url: "https://api.acousticobservatory.org/audio_recordings/1243187/media.mp3?end_offset=690&start_offset=660"
            - name: "Striped Honeyeater"
              description: "A streaky grey-and-white honeyeater of inland woodland that builds a hanging nest and sings rich, rollicking phrases."
              examples:
                - url: "https://api.acousticobservatory.org/audio_recordings/670669/media.mp3?end_offset=5280&start_offset=5250"
            - name: "Tawny Frogmouth"
              description: "A nocturnal, owl-like bird that roosts by day disguised as a broken branch and gives a low, repeated 'oom' call at night."
              examples:
                - url: "https://api.acousticobservatory.org/audio_recordings/667535/media.mp3?end_offset=1350&start_offset=1320"
            - name: "Placeholder species"
              description: "Placeholder description."
            - name: "Placeholder species"
              description: "Placeholder description."
            - name: "Placeholder species"
              description: "Placeholder description."
  style:
    xsmallBreakPoint: 425px
    smallBreakPoint: 768px
    mediumBreakPoint: 1024px
    largeBreakPoint: 1200px
    roundedButtons: true
    themeColor:
      hue: 30deg
      saturation: 62%
      lightness: 49%
    themeShades:
      "50": rgb(252 249 245)
      "100": rgb(247 234 222)
      "200": rgb(240 219 196)
      "300": rgb(233 201 168)
      "400": rgb(224 177 130)
      "500": rgb(211 146 80)
      "600": rgb(186 115 44)
      "700": rgb(153 95 36)
      "800": rgb(126 78 30)
      "900": rgb(90 56 21)
      "950": rgb(55 34 13)
